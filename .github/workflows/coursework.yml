name: Coursework native verification

on:
  workflow_dispatch:
    inputs:
      metrics:
        description: Run the frozen longer STM benchmark sweep
        type: boolean
        default: false
      profile_only:
        description: Profile the large-account read footprint without a timing campaign
        type: boolean
        default: false
      framework:
        description: Run the existing multicore-bench read-only footprint comparison
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ocaml-5:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QCHECK_MSG_INTERVAL: '60'
      OCAMLRUNPARAM: b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3
        with:
          ocaml-compiler: 5.3.0
      - name: Resolve and record package versions
        run: |
          mkdir -p .agents/runs/ci-${GITHUB_RUN_ID} .agents/runs/ci-failure-${GITHUB_RUN_ID}
          opam install . --deps-only --with-test
          opam lock --keep-local .
          opam install . --deps-only --with-test --locked
          opam list --installed --columns=name,version --color=never > .agents/opam-packages.txt
          opam exec -- dune build @all
      - name: Run upstream and coursework tests
        run: opam exec -- dune runtest --display=short
      - name: Drive native transaction checks
        shell: bash
        run: |
          opam exec -- dune exec coursework/bin/stm_verify.exe -- --doctor 2>&1 | tee .agents/runs/ci-${GITHUB_RUN_ID}/doctor.log
          opam exec -- dune exec coursework/bin/stm_verify.exe -- --evidence .agents/runs/ci-${GITHUB_RUN_ID} 2>&1 | tee .agents/runs/ci-${GITHUB_RUN_ID}/drive.log
          python -c 'import json, os; d=json.load(open(".agents/runs/ci-"+os.environ["GITHUB_RUN_ID"]+"/verification.json")); assert d["passed"] is True and d["cleanup_complete"] is True'
      - name: Prove failed verdict survives
        shell: bash
        run: |
          set +e
          opam exec -- dune exec coursework/bin/stm_verify.exe -- --inject-failure --evidence .agents/runs/ci-failure-${GITHUB_RUN_ID} 2>&1 | tee .agents/runs/ci-failure-${GITHUB_RUN_ID}/drive.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "deliberate failure unexpectedly passed" >&2
            exit 1
          fi
          grep -F '"passed":false' .agents/runs/ci-failure-${GITHUB_RUN_ID}/verification.json
          python - <<'PY'
          import json, os
          with open('.agents/runs/ci-failure-' + os.environ['GITHUB_RUN_ID'] + '/verification.json') as source:
              result = json.load(source)
          assert result['passed'] is False and result['cleanup_complete'] is True
          assert result['details'] == 'Failure("deliberate verification failure")'
          PY
      - name: Record interleaved native backend measurements
        run: opam exec -- dune exec --profile release coursework/bench/stm_bench.exe -- --output .agents/runs/ci-${GITHUB_RUN_ID}/bench.csv
      - name: Run the optional frozen metrics sweep
        if: inputs.metrics || inputs.profile_only
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace valgrind
          mode=--metrics
          if [[ "${{ inputs.profile_only }}" == true ]]; then mode=--profile; fi
          bash coursework/scripts/verify.sh "$mode" metrics-${GITHUB_RUN_ID}
      - name: Existing multicore-bench read-only comparison
        if: inputs.framework
        shell: bash
        run: |
          evidence=".agents/runs/framework-${GITHUB_RUN_ID}"
          mkdir -p "$evidence"
          opam exec -- dune build --profile release coursework/bench/stm_framework.exe
          { git rev-parse HEAD; lscpu; opam exec -- ocamlc -version; opam list --installed; sha256sum _build/default/coursework/bench/stm_framework.exe; } > "$evidence/environment.txt"
          for repeat in 1 2 3 4 5; do
            timeout 180 _build/default/coursework/bench/stm_framework.exe > "$evidence/framework-$repeat.json" 2> "$evidence/framework-$repeat.stderr"
          done
          python3 - "$evidence" <<'PY'
          import json, math, pathlib, sys
          files = sorted(pathlib.Path(sys.argv[1]).glob('framework-*.json'))
          assert len(files) == 5
          for path in files:
              data = json.load(path.open())
              assert data['results']
              metrics = [metric for suite in data['results'] for metric in suite['metrics']]
              assert metrics and all(metric['#runs'] == 5 and math.isfinite(metric['value']) and metric['value'] > 0 for metric in metrics)
          PY
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ocaml-5-evidence-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .agents/runs/ci-${{ github.run_id }}
            .agents/runs/ci-failure-${{ github.run_id }}
            .agents/runs/metrics-${{ github.run_id }}
            .agents/runs/framework-${{ github.run_id }}
            .agents/opam-packages.txt
            *.opam.locked
          if-no-files-found: error

name: Coursework native verification

on:
  workflow_dispatch:
    inputs:
      metrics:
        description: Run the frozen longer STM benchmark sweep
        type: boolean
        default: false
      profile_only:
        description: Profile the large-account read footprint without a timing campaign
        type: boolean
        default: false
      framework:
        description: Compare frozen and current TL2 with matched multicore-bench fixtures
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ocaml-5:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      QCHECK_MSG_INTERVAL: '60'
      OCAMLRUNPARAM: b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3
        with:
          ocaml-compiler: 5.3.0
      - name: Resolve and record package versions
        run: |
          mkdir -p .agents/runs/ci-${GITHUB_RUN_ID} .agents/runs/ci-failure-${GITHUB_RUN_ID}
          opam install . --deps-only --with-test
          opam lock --keep-local .
          opam install . --deps-only --with-test --locked
          opam list --installed --columns=name,version --color=never > .agents/opam-packages.txt
          opam exec -- dune build @all
      - name: Run upstream and coursework tests
        run: opam exec -- dune runtest --display=short
      - name: Drive native transaction checks
        shell: bash
        run: |
          opam exec -- dune exec coursework/bin/stm_verify.exe -- --doctor 2>&1 | tee .agents/runs/ci-${GITHUB_RUN_ID}/doctor.log
          opam exec -- dune exec coursework/bin/stm_verify.exe -- --evidence .agents/runs/ci-${GITHUB_RUN_ID} 2>&1 | tee .agents/runs/ci-${GITHUB_RUN_ID}/drive.log
          python -c 'import json, os; d=json.load(open(".agents/runs/ci-"+os.environ["GITHUB_RUN_ID"]+"/verification.json")); assert d["passed"] is True and d["cleanup_complete"] is True'
      - name: Prove failed verdict survives
        shell: bash
        run: |
          set +e
          opam exec -- dune exec coursework/bin/stm_verify.exe -- --inject-failure --evidence .agents/runs/ci-failure-${GITHUB_RUN_ID} 2>&1 | tee .agents/runs/ci-failure-${GITHUB_RUN_ID}/drive.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "deliberate failure unexpectedly passed" >&2
            exit 1
          fi
          grep -F '"passed":false' .agents/runs/ci-failure-${GITHUB_RUN_ID}/verification.json
          python - <<'PY'
          import json, os
          with open('.agents/runs/ci-failure-' + os.environ['GITHUB_RUN_ID'] + '/verification.json') as source:
              result = json.load(source)
          assert result['passed'] is False and result['cleanup_complete'] is True
          assert result['details'] == 'Failure("deliberate verification failure")'
          PY
      - name: Record interleaved native backend measurements
        run: opam exec -- dune exec --profile release coursework/bench/stm_bench.exe -- --output .agents/runs/ci-${GITHUB_RUN_ID}/bench.csv
      - name: Run the optional frozen metrics sweep
        if: inputs.metrics || inputs.profile_only
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace valgrind
          mode=--metrics
          if [[ "${{ inputs.profile_only }}" == true ]]; then mode=--profile; fi
          bash coursework/scripts/verify.sh "$mode" metrics-${GITHUB_RUN_ID}
      - name: Matched multicore-bench read-only comparison
        if: inputs.framework
        shell: bash
        run: |
          evidence=".agents/runs/framework-${GITHUB_RUN_ID}"
          mkdir -p "$evidence"
          baseline="$RUNNER_TEMP/stm-baseline-${GITHUB_RUN_ID}"
          baseline_owned=false
          frozen=6ecf556be3102730b6eef054c09c2a02aa279809
          printf '{"passed":false,"details":"matched comparison not completed"}\n' > "$evidence/framework-result.json"
          finish_framework() {
            status=$?
            trap - EXIT
            cleanup=true
            if [ "$baseline_owned" = true ] && [ -d "$baseline" ]; then
              if [ "$baseline" = "$RUNNER_TEMP/stm-baseline-${GITHUB_RUN_ID}" ]; then
                rm -rf -- "$baseline" || cleanup=false
              else cleanup=false; fi
            fi
            if [ "$cleanup" != true ]; then status=1; fi
            python3 -c 'import json,os,sys; status=int(sys.argv[1]); cleanup=sys.argv[2]=="true"; p=sys.argv[3]; temporary=p+".tmp"; json.dump(dict(passed=status==0 and cleanup,exit_code=status,cleanup_complete=cleanup,fixture="8192 accounts; 1000 snapshots/domain; 3 warmups; 5 native runs; 5 alternating passes per source",baseline_source="6ecf556be3102730b6eef054c09c2a02aa279809",candidate_source=os.environ["GITHUB_SHA"]),open(temporary,"w"),indent=2); os.replace(temporary,p)' "$status" "$cleanup" "$evidence/framework-result.json"
            exit "$status"
          }
          trap finish_framework EXIT
          test ! -e "$baseline"
          mkdir "$baseline"
          baseline_owned=true
          git fetch --no-tags origin "$frozen"
          git archive --format=tar --output "$baseline/.source-archive.tar" "$frozen"
          sha256sum "$baseline/.source-archive.tar" > "$evidence/baseline-archive.sha256"
          tar -xf "$baseline/.source-archive.tar" -C "$baseline"
          rm -- "$baseline/.source-archive.tar"
          cp coursework/bench/stm_framework.ml "$baseline/coursework/bench/stm_framework.ml"
          cmp coursework/bench/stm_framework.ml "$baseline/coursework/bench/stm_framework.ml"
          opam exec -- dune build --profile release coursework/bench/stm_framework.exe
          opam exec -- dune build --root "$baseline" --profile release coursework/bench/stm_framework.exe
          opam exec -- dune runtest --root "$baseline" --display=short > "$evidence/baseline-tests.log" 2>&1
          { printf 'baseline_source=%s\ncandidate_source=%s\nfixture_version=8192accounts-1000snapshots-v2\n' "$frozen" "$GITHUB_SHA"; lscpu; opam exec -- ocamlc -version; opam list --installed; sha256sum coursework/bench/stm_framework.ml "$baseline/coursework/bench/stm_framework.ml" _build/default/coursework/bench/stm_framework.exe "$baseline/_build/default/coursework/bench/stm_framework.exe"; } > "$evidence/environment.txt"
          failed=0
          for repeat in 1 2 3 4 5; do
            order="baseline candidate"
            if (( repeat % 2 == 0 )); then order="candidate baseline"; fi
            for variant in $order; do
              exe="_build/default/coursework/bench/stm_framework.exe"
              if [ "$variant" = baseline ]; then exe="$baseline/$exe"; fi
              prefix="$evidence/framework-$variant-$repeat"
              printf '%s %s\n' "$repeat" "$variant" >> "$evidence/pass-order.txt"
              printf '%q ' /usr/bin/time -v -o "$prefix.resources.txt" timeout 180 "$exe" > "$prefix.command.txt"
              set +e
              /usr/bin/time -v -o "$prefix.resources.txt" timeout 180 "$exe" > "$prefix.json" 2> "$prefix.stderr"
              status=$?
              set -e
              python3 -c 'import json,sys; json.dump(dict(passed=int(sys.argv[1])==0,exit_code=int(sys.argv[1]),variant=sys.argv[2],pass_index=int(sys.argv[3])),open(sys.argv[4],"w"),indent=2)' "$status" "$variant" "$repeat" "$prefix.result.json"
              if [ "$status" -ne 0 ]; then failed=1; fi
            done
          done
          test "$failed" -eq 0
          python3 - "$evidence" <<'PY'
          import json, math, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          domains = [d for d in (1, 2, 4) if d <= os.cpu_count()]
          expected = {f'{backend} readonly {d} domains' for backend in ('kcas', 'tl2', 'mutex') for d in domains}
          for variant in ('baseline', 'candidate'):
              for repeat in range(1, 6):
                  prefix = root / f'framework-{variant}-{repeat}'
                  receipt = json.loads(prefix.with_suffix('.result.json').read_text())
                  assert receipt['passed'] is True and receipt['exit_code'] == 0
                  data = json.loads(prefix.with_suffix('.json').read_text())
                  assert len(data['results']) == len(expected)
                  assert {suite['name'] for suite in data['results']} == expected
                  for suite in data['results']:
                      assert len(suite['metrics']) == 2 and {m['units'] for m in suite['metrics']} == {'ns', 'M/s'}
                      for metric in suite['metrics']:
                          assert metric['#runs'] == 5
                          assert all(math.isfinite(metric[key]) and metric[key] > 0 for key in ('value', '#best', '#mean', '#median'))
                          assert math.isfinite(metric['#sd']) and metric['#sd'] >= 0
          PY
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ocaml-5-evidence-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .agents/runs/ci-${{ github.run_id }}
            .agents/runs/ci-failure-${{ github.run_id }}
            .agents/runs/metrics-${{ github.run_id }}
            .agents/runs/framework-${{ github.run_id }}
            .agents/opam-packages.txt
            *.opam.locked
          if-no-files-found: error
